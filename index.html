<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>María Remedios del Valle</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,serif;background:#e8f4fd;min-height:100vh}
.app{max-width:980px;margin:0 auto;padding:1rem}
.header{text-align:center;padding:1.5rem 0 1rem;color:#0d47a1}
.header h1{font-size:22px;font-weight:700;margin-bottom:4px}
.header p{font-size:13px;color:#1565c0;font-style:italic}
.slide-wrap{background:#fff;border-radius:16px;border:1.5px solid #bbdefb;overflow:hidden;margin-bottom:1rem;animation:fadeIn .6s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.slide-year{background:#1565c0;color:#fff;padding:10px 20px;font-size:13px;letter-spacing:2px;display:flex;align-items:center;gap:10px}
.slide-year span{font-size:18px;font-weight:700}
.slide-content{display:grid;grid-template-columns:1.25fr 1fr;min-height:430px}
.slide-art{position:relative;background:#0d1520;overflow:hidden;min-height:430px}
.slide-text{padding:1.4rem 1.6rem;display:flex;flex-direction:column;justify-content:center;border-left:1px solid #e3f2fd}
.slide-text h2{font-size:16px;color:#0d47a1;margin-bottom:10px;font-weight:700;line-height:1.3}
.slide-text p{font-size:14px;color:#1a237e;line-height:1.75;margin-bottom:10px}
.slide-text p:last-child{margin-bottom:0}
.slide-text .quote{background:#e8f5e9;border-left:3px solid #2e7d32;padding:8px 12px;border-radius:0 6px 6px 0;font-size:13px;color:#1b5e20;font-style:italic;margin-top:8px;line-height:1.6}
.slide-text .highlight{background:#fff3e0;border-left:3px solid #e65100;padding:8px 12px;border-radius:0 6px 6px 0;font-size:13px;color:#bf360c;margin-top:8px;line-height:1.6}
.nav-bar{display:flex;align-items:center;justify-content:space-between;padding:0.8rem 1rem;background:#1565c0;border-radius:12px;margin-bottom:0.5rem}
.nav-bar button{background:#fff;color:#1565c0;border:none;border-radius:20px;padding:6px 18px;font-size:13px;font-weight:700;cursor:pointer}
.nav-bar button:focus-visible{outline:3px solid #ffcc80;outline-offset:2px}
.nav-bar button:disabled{opacity:0.3;cursor:default}
.nav-bar .dots{display:flex;gap:6px}
.nav-bar .dot{width:8px;height:8px;border-radius:50%;background:#90caf9;transition:background .3s}
.nav-bar .dot.on{background:#fff}
.footer{text-align:center;font-size:11px;color:#1565c0;padding-bottom:1rem;font-style:italic}

/* Capas de la escena */
.stack{position:absolute;inset:0;transform-origin:50% 62%;animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.055)}}
.ly{position:absolute;inset:0;width:100%;height:100%;display:block}
.drift{animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.scr{mix-blend-mode:screen}
.ovl{mix-blend-mode:overlay;opacity:.32}

/* Estilos para video en la Escena 3 */
.video-container-s3 {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0b111a;
  display: flex;
  align-items: center;
  justify-content: center;
}
.video-container-s3 video {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
}
.family-march-overlay {
  position: absolute;
  bottom: 0px;
  left: 50%;
  transform: translateX(-50%);
  width: 240px;
  pointer-events: none;
  animation: familyMarchSway 4.2s ease-in-out infinite alternate;
}
.family-march-overlay img {
  width: 100%;
  display: block;
}
@keyframes familyMarchSway {
  0% { transform: translateX(-52%) scale(1); }
  50% { transform: translateX(-48%) scale(1.02); }
  100% { transform: translateX(-52%) scale(1); }
}

/* Animación conmovedora para Remedios en la Escena 4 (Huaqui) */
.anim-remedios-duelo {
  transform-origin: 260px 320px;
  animation: remediosDueloBreath 4.6s ease-in-out infinite alternate;
}
@keyframes remediosDueloBreath {
  0% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-3px) rotate(-0.5deg); }
  100% { transform: translateY(0px) rotate(0.4deg); }
}

.anim-rayo-luz {
  animation: rayoLuzPulse 5s ease-in-out infinite alternate;
}
@keyframes rayoLuzPulse {
  0% { opacity: 0.65; }
  50% { opacity: 0.95; }
  100% { opacity: 0.7; }
}

/* Animación cinematográfica horizontal para Escena 6 (Ayohuma - Prisionera) */
.pan-escena6-bg {
  animation: panAyohumaH 14s ease-in-out infinite alternate;
}
@keyframes panAyohumaH {
  0% { transform: scale(1.05) translateX(-8px); }
  50% { transform: scale(1.05) translateX(8px); }
  100% { transform: scale(1.05) translateX(-8px); }
}

.anim-prisionera-tension {
  transform-origin: 240px 260px;
  animation: prisioneraTensionH 5s ease-in-out infinite alternate;
}
@keyframes prisioneraTensionH {
  0% { transform: translateX(-2.5px) rotate(-0.3deg); }
  50% { transform: translateX(2.5px) rotate(0.4deg); }
  100% { transform: translateX(-2.5px) rotate(-0.3deg); }
}

/* Cuadro comparativo final: Belgrano vs Remedios del Valle */
.compare-container {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: 1.2rem;
  background: #0f172a;
  color: #f1f5f9;
  overflow-y: auto;
}
.compare-header-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  margin-bottom: 0.8rem;
}
.compare-hero-card {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #1e293b;
  padding: 8px 12px;
  border-radius: 12px;
  border: 1.5px solid #334155;
}
.compare-hero-card.belgrano {
  border-color: #38bdf8;
  background: linear-gradient(135deg, #1e293b 0%, #0c2847 100%);
}
.compare-hero-card.remedios {
  border-color: #fb923c;
  background: linear-gradient(135deg, #1e293b 0%, #3d1f11 100%);
}
.compare-hero-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #fff;
  background: #000;
  flex-shrink: 0;
}
.compare-hero-title {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
}
.compare-hero-sub {
  font-size: 11px;
  color: #94a3b8;
}
.compare-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0 6px;
  font-size: 11.5px;
  line-height: 1.45;
}
.compare-row {
  background: #1e293b;
  border-radius: 8px;
  transition: transform 0.15s;
}
.compare-row:hover {
  background: #243248;
}
.compare-topic {
  padding: 8px 10px;
  font-weight: 700;
  color: #cbd5e1;
  background: #162032;
  border-top-left-radius: 8px;
  border-bottom-left-radius: 8px;
  width: 22%;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  border-left: 3px solid #60a5fa;
}
.compare-val-belgrano {
  padding: 8px 10px;
  color: #bae6fd;
  width: 39%;
  border-right: 1px solid #334155;
}
.compare-val-remedios {
  padding: 8px 10px;
  color: #fed7aa;
  width: 39%;
  border-top-right-radius: 8px;
  border-bottom-right-radius: 8px;
}


.slide-compare-split {
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  min-height: 480px;
  background: #0f172a;
}
.compare-video-side {
  position: relative;
  background: #0b111a;
  display: flex;
  align-items: center;
  justify-content: center;
  border-left: 1px solid #1e293b;
  overflow: hidden;
}
.compare-video-side video {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
}
@media (max-width: 768px) {
  .slide-compare-split {
    grid-template-columns: 1fr;
  }
  .compare-video-side {
    min-height: 280px;
    border-left: none;
    border-top: 1px solid #1e293b;
  }
}

/* ============================================================
   SECUENCIA CINEMATOGRÁFICA ESCENA 2 (Como una película en 3 actos)
   Acto 1 (0s-5s): Ingleses avanzan desde la izquierda vs Patriotas y Barricada disparando desde la derecha
   Acto 2 (5s-10s): Fogonazos y explosión: los ingleses huyen aterrados hacia la izquierda
   Acto 3 (10s-16s): Transición suave hacia la retaguardia donde Remedios cura al soldado herido
   ============================================================ */
/* SECUENCIA SINCRONIZADA A 15 SEGUNDOS (Sin reinicios accidentales)
   0s - 5s  (0% a 33%): ACTO 1 - Combate: ingleses avanzando vs argentinos disparando
   5s - 10s (33% a 66%): ACTO 2 - Explosión y huida aterrada de los soldados en ropa interior
   10s - 15s (66% a 100%): ACTO 3 - Transición a Remedios curando al soldado herido */
.movie-act1-combat {
  animation: movieAct1 15s ease-in-out infinite;
}
.movie-act2-retreat {
  animation: movieAct2 15s ease-in-out infinite;
}
.movie-act3-remedios {
  animation: movieAct3 15s ease-in-out infinite;
}

@keyframes movieAct1 {
  0% { opacity: 1; pointer-events: auto; }
  31% { opacity: 1; pointer-events: auto; }
  34% { opacity: 0; pointer-events: none; }
  100% { opacity: 0; pointer-events: none; }
}

@keyframes movieAct2 {
  0%, 31% { opacity: 0; pointer-events: none; }
  34% { opacity: 1; pointer-events: auto; }
  64% { opacity: 1; pointer-events: auto; }
  67% { opacity: 0; pointer-events: none; }
  100% { opacity: 0; pointer-events: none; }
}

@keyframes movieAct3 {
  0%, 64% { opacity: 0; pointer-events: none; }
  67% { opacity: 1; pointer-events: auto; }
  97% { opacity: 1; pointer-events: auto; }
  100% { opacity: 0; pointer-events: none; }
}

/* Animaciones horizontales cinematográficas sincronizadas con el ciclo total */
.anim-ingleses-advance-movie {
  animation: inglesesMovieAdvance 15s linear infinite;
}
@keyframes inglesesMovieAdvance {
  0% { transform: translateX(-15px); }
  32% { transform: translateX(12px); }
  100% { transform: translateX(-15px); }
}

.anim-patriotas-fire-movie {
  animation: patriotasMovieFire 0.8s ease-in-out infinite alternate;
}
@keyframes patriotasMovieFire {
  0% { transform: translateX(0px); }
  30% { transform: translateX(4px); }
  100% { transform: translateX(0px); }
}

/* Fuga horizontal aterrada sincronizada con los 5 segundos del Acto 2 */
.anim-ingleses-flee-movie {
  animation: inglesesMovieFlee 15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
}
@keyframes inglesesMovieFlee {
  0%, 33% { transform: translateX(25px) scale(1); }
  66% { transform: translateX(-70px) scale(0.95); }
  100% { transform: translateX(25px) scale(1); }
}

/* Balas patriotas viajando rápidamente hacia la izquierda */
.bullet-left-1 {
  animation: bulletFly1 0.9s cubic-bezier(0.25, 1, 0.5, 1) infinite;
}
.bullet-left-2 {
  animation: bulletFly2 1.3s cubic-bezier(0.25, 1, 0.5, 1) infinite 0.4s;
}
@keyframes bulletFly1 {
  0% { transform: translateX(0px); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateX(-260px); opacity: 0; }
}
@keyframes bulletFly2 {
  0% { transform: translateX(0px); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateX(-240px); opacity: 0; }
}

/* Remedios curando con balanceo horizontal sutil */
.anim-remedios-curando-movie {
  transform-origin: 240px 240px;
  animation: remediosCurandoMovie 4.5s ease-in-out infinite alternate;
}
@keyframes remediosCurandoMovie {
  0% { transform: translateX(-3px) rotate(-0.3deg); }
  50% { transform: translateX(3px) rotate(0.4deg); }
  100% { transform: translateX(-3px) rotate(-0.3deg); }
}

/* Animacion horizontal y acunado para los personajes de plastilina */
.clay-family-group {
  transform-origin: 240px 328px;
  animation: familyHorizontalSway 4.5s ease-in-out infinite alternate;
}
@keyframes familyHorizontalSway {
  0% { transform: translateX(0px) rotate(0deg); }
  35% { transform: translateX(4px) rotate(0.6deg); }
  70% { transform: translateX(-3.5px) rotate(-0.5deg); }
  100% { transform: translateX(0px) rotate(0deg); }
}

@media (max-width:720px){
  .slide-content{grid-template-columns:1fr}
  .slide-art{min-height:0;aspect-ratio:4/3}
  .slide-text{border-left:none;border-top:1px solid #e3f2fd}
}
@media (prefers-reduced-motion:reduce){.stack,.drift,.sway-head-f,.sway-head-m,.cradle-baby{animation:none}}
</style>
</head>

/* ---------- ensamblado de capas ---------- */
function layers(a){
  var vb='viewBox="0 0 480 360" preserveAspectRatio="xMidYMid slice"';
  if(a.isCustomHtml){
    return a.html;
  }
  if(a.isVideo){
    return '<div class="video-container-s3">'+
      '<video autoplay playsinline controls controlslist="nodownload" src="'+a.videoSrc+'" style="max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;"></video>'+
      '<svg class="ly" style="pointer-events:none;" '+vb+'>'+
        '<rect width="480" height="360" fill="url(#vig)"/>'+
        a.cap+
      '</svg>'+
      '<svg class="ly ovl" style="pointer-events:none;" '+vb+'><rect width="480" height="360" filter="url(#grain)"/></svg>'+
    '</div>';
  }
  return '<div class="stack">'+
    '<svg class="ly" '+vb+'>'+a.bg+'</svg>'+
    (a.mid?'<svg class="ly drift" '+vb+'>'+a.mid+'</svg>':'')+
    '<svg class="ly" '+vb+'>'+a.fg+'</svg>'+
    '<svg class="ly scr" '+vb+'>'+a.gl+'</svg>'+
    '<svg class="ly" '+vb+'><rect width="480" height="360" fill="url(#vig)"/>'+a.cap+'</svg>'+
    '<svg class="ly ovl" '+vb+'><rect width="480" height="360" filter="url(#grain)"/></svg>'+
  '</div>';
}

var slides = [
{year:"~1766",label:"Nacimiento",art:s1(),
title:"Nace Remedios en Buenos Aires",
text:`<p>Alrededor de <strong>1766</strong>, en la ciudad de Buenos Aires, nació una niña a la que llamaron <strong>María Remedios</strong>. Sus padres eran afrodescendientes, descendientes de personas traídas a la fuerza desde África como esclavos.</p><p>En esa época, las personas de origen africano vivían en la base de la sociedad colonial. Remedios nació libre, pero <strong>pobre y sin derechos</strong>. El sistema colonial la llamaba "parda".</p><p>Nadie hubiera imaginado entonces que esa bebé se convertiría en una de las heroínas más grandes de la historia argentina.</p>`
},
{year:"1807",label:"Invasiones Inglesas",art:s2(),
title:"Las Invasiones Inglesas — su primera batalla",
text:`<p>En <strong>1807</strong>, los ingleses intentaron apoderarse de Buenos Aires por segunda vez. La ciudad resistió gracias a sus propios vecinos, que tomaron las armas sin esperar ayuda del ejército español.</p><p>Remedios se sumó como <strong>enfermera voluntaria</strong>. Cuidó a los soldados heridos del Tercio de Andaluces, uno de los grupos que defendió la ciudad. Sin entrenamiento, sin recursos, con lo que tenía a mano.</p><p>Fue su primera experiencia de guerra. Aprendió que <strong>ella podía hacer más que quedarse en casa</strong>. Cuando llegara la revolución, ya estaría lista.</p>`
},
{year:"1810",label:"Se une al Ejército",art:s3(),
title:"1810 — Remedios se une al Ejército del Norte",
text:`<p>El <strong>6 de julio de 1810</strong>, pocas semanas después de la Revolución de Mayo, Remedios tomó su mochila y se unió a la marcha del <strong>Ejército del Norte</strong>. Iba con su marido y sus dos hijos.</p><p>El ejército partía desde Buenos Aires hacia el norte, <strong>rumbo al Alto Perú</strong> (hoy Bolivia), con la misión de liberar esos territorios del dominio español. El capitán Bernardo de Anzoátegui comandaba la compañía a la que se unió la familia.</p><p>Remedios no iba a esperar en casa. Iba a <strong>cocinar, curar heridos, cargar provisiones</strong> y, cuando hiciera falta, a pelear. La guerra de independencia había comenzado.</p>`
},
{year:"1811",label:"Huaqui — pérdida",art:s4(),
title:"1811 — La derrota de Huaqui y la pérdida de su familia",
text:`<p>En <strong>1811</strong>, el Ejército del Norte sufrió una dura derrota en la batalla de <strong>Huaqui</strong>, en el Alto Perú. Las fuerzas españolas los superaron y los patriotas debieron retirarse.</p><p>En medio del caos de esa retirada, <strong>Remedios perdió a su marido y a sus dos hijos</strong>. Murieron en campaña. Quedó completamente sola, sin familia, lejos de su ciudad, en territorio enemigo.</p><p>Cualquier persona hubiera regresado. <strong>Remedios no lo hizo</strong>. Se quedó con el ejército. Siguió cocinando, curando heridos y marchando. Su familia había muerto por la patria — ella iba a seguir hasta que esa patria fuera libre.</p><div class="highlight">Su pérdida no la quebró. La hizo más fuerte.</div>`
},
{year:"1812",label:"Tucumán — La Capitana",art:s5(),
title:"1812 — La batalla de Tucumán y el título de Capitana",
text:`<p>En septiembre de <strong>1812</strong>, antes de la batalla de Tucumán, Remedios se presentó ante el general <strong>Manuel Belgrano</strong> y le pidió permiso para ir al frente a ayudar a los heridos.</p><p>Belgrano se lo negó. En esa época, las mujeres no participaban de los combates. Su lugar era la retaguardia: lavar, cocinar, cuidar a los heridos lejos del frente. <strong>Esa era la regla.</strong></p><p>Remedios <strong>no le hizo caso</strong>. Cuando empezó la batalla, fue al frente de todos modos. Atendió heridos en medio del fuego, alentó a los soldados que flaqueaban y hasta enfrentó a los españoles con las armas.</p><p>Los soldados, viendo su valentía, empezaron a gritar <strong>"¡Madre de la Patria!"</strong>. Belgrano, impresionado, no tuvo más opción: la nombró oficialmente <strong>Capitana del Ejército</strong>. Era la única mujer en obtener ese rango.</p><div class="quote">"No había acción en la que ella pudiera tomar parte que no la tomase." — Tomás de Anchorena, secretario de Belgrano</div>`
},
{year:"1813",label:"Ayohuma — prisionera",art:s6(),
title:"1813 — Ayohuma: herida, prisionera y torturada",
text:`<p>En noviembre de <strong>1813</strong>, el Ejército del Norte sufrió una derrota terrible en la batalla de <strong>Ayohuma</strong>. Los españoles ganaron. Remedios combatió hasta el final — y fue <strong>herida de bala</strong>.</p><p>Los españoles la tomaron prisionera. Al descubrir que desde el campo de prisioneros había ayudado a escapar a varios oficiales patriotas, la condenaron a un castigo brutal: <strong>nueve días de azotes públicos</strong>. Las cicatrices le quedaron para siempre en los brazos.</p><p>Logró escapar. Y en vez de rendirse, se reintegró al ejército y <strong>siguió peleando</strong> junto a las fuerzas de Güemes y Álvarez de Arenales hasta que terminó la guerra.</p><div class="highlight">Fue herida seis veces de bala a lo largo de toda la guerra. Nunca se retiró voluntariamente.</div>`
},
{year:"~1820",label:"El olvido",art:s7('olvido'),
title:"El olvido: anciana y sola",
text:`<p>Terminada la guerra, Remedios volvió a Buenos Aires anciana y <strong>completamente sola</strong>. Sin familia, sin dinero, sin pensión. Vivía en un rancho, mendigaba en los atrios de las iglesias y nadie la reconocía.</p><p>Se hacía llamar "la Capitana" y mostraba las cicatrices de los azotes en sus brazos. La gente creía que estaba loca.</p>`
},
{year:"1827",label:"Reconocimiento tardío",art:s7('viamonte'),
title:"1827 — \"¡Usted es la Capitana!\"",
text:`<p>En <strong>1827</strong>, el general Juan José Viamonte la encontró pidiendo limosna en la Plaza de Mayo y la reconoció: <strong>"¡Usted es la Capitana!"</strong>. Gracias a él, la Junta de Representantes le otorgó una pequeña pensión — apenas 1 peso por día, menos que una lavandera.</p>`
},
{year:"1830-1847",label:"Sargento Mayor y Legado",art:s9(),
title:"1830 — Sargento Mayor y su legado eterno",
text:`<p>En <strong>1830</strong>, Juan Manuel de Rosas la ascendió a <strong>Sargento Mayor</strong> y le otorgó una pensión digna en reconocimiento a sus servicios en la Independencia.</p><p>Remedios murió el <strong>8 de noviembre de 1847</strong>. En su honor, ese día se conmemora en todo el país el <strong>Día Nacional de los Afroargentinos</strong>. Desde 2024, su rostro ilustra el billete de $10.000 como Madre de la Patria.</p><div class="quote">La historia casi la olvidó. Nosotros no vamos a hacerlo.</div>`
},

var cur = 0;
var container = document.getElementById("slides");
var dotsEl = document.getElementById("dots");

slides.forEach(function(s,i){
  var d = document.createElement("div");
  d.id="dot"+i;
  d.className="dot"+(i===0?" on":"");
  dotsEl.appendChild(d);

function render(){
  var s = slides[cur];
  if(s.isCompareSplit){
    container.innerHTML = '<div class="slide-wrap"><div class="slide-year"><span>'+s.year+'</span> &nbsp;·&nbsp; '+s.label+'</div><div class="slide-compare-split"><div class="compare-table-side">'+layers(s.art)+'</div><div class="compare-video-side"><video autoplay playsinline controls controlslist="nodownload" src="'+s.videoSrc+'"></video></div></div></div>';
  } else {
    container.innerHTML = '<div class="slide-wrap"><div class="slide-year"><span>'+s.year+'</span> &nbsp;·&nbsp; '+s.label+'</div><div class="slide-content"><div class="slide-art">'+layers(s.art)+'</div><div class="slide-text"><h2>'+s.title+'</h2>'+s.text+'</div></div></div>';
  }
  document.querySelectorAll(".dot").forEach(function(d,i){ d.className="dot"+(i===cur?" on":""); });
  document.getElementById("prev").disabled = cur===0;
  document.getElementById("next").disabled = cur===slides.length-1;
  var v = container.querySelector("video");
  if(v){
    v.muted = false;
    v.volume = 1.0;
    v.play().catch(function(){
      v.muted = true;
      v.play();
    });
  }
}

window.go = function(dir){
  cur = Math.max(0,Math.min(slides.length-1,cur+dir));
  render();
};
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight")go(1);
  if(e.key==="ArrowLeft")go(-1);
});

render();
